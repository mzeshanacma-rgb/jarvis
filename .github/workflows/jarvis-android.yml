name: Jarvis Android

on:
  push:
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-android.yml"
  pull_request:
    paths:
      - "jarvis/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint (errors fail the build)
        run: ./gradlew --no-daemon lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-reports
          path: |
            jarvis/app/build/reports/
            jarvis/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a public release (direct download link)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jarvis.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest jarvis.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Jarvis (latest build)" \
            --notes "Debug APK built from commit $GITHUB_SHA. Install on Android 8+ (allow installs from this source)."

  device-test:
    # Boots a real Android 14 emulator, installs the APK, opens every main screen, takes screenshots
    # (published on the 'latest' release) and fails if the app crashes.
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash jarvis/ci/device-smoke.sh "$(ls apk/*.apk | head -1)" screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-screenshots
          path: screenshots/
      - name: Publish screenshots on the release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest screenshots/*.png --clobber --repo "$GITHUB_REPOSITORY"
