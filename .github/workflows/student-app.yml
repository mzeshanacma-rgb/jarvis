name: Student App

on:
  push:
    paths:
      - "student-app/**"
      - ".github/workflows/student-app.yml"
  pull_request:
    paths:
      - "student-app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Server and web tests (includes tenant isolation)
        run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint (errors fail the build)
        run: ./gradlew --no-daemon lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Build release APK
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.STUDENT_APP_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STUDENT_APP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon assembleRelease
          ls app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-app-android-reports
          path: |
            student-app/android/app/build/reports/
            student-app/android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: student-app-apk
          path: |
            student-app/android/app/build/outputs/apk/debug/*.apk
            student-app/android/app/build/outputs/apk/release/*.apk

  device-test:
    needs: [web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: student-app
      - uses: actions/download-artifact@v4
        with:
          name: student-app-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash student-app/android/ci/device-smoke.sh "$(ls apk/debug/*.apk | head -1)" screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-app-device-screenshots
          path: screenshots/

  publish:
    needs: [android, device-test]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: student-app-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: student-app-device-screenshots
          path: screenshots
      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/debug/app-debug.apk assignment-review-debug.apk
          FILES="assignment-review-debug.apk"
          if [ -f apk/release/app-release.apk ]; then cp apk/release/app-release.apk assignment-review.apk; FILES="$FILES assignment-review.apk"; fi
          gh release delete student-app-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create student-app-latest $FILES screenshots/*.png \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Assignment Review Android (latest build)" \
            --notes "Android app for the Assignment Review web app. Built from commit $GITHUB_SHA on $GITHUB_REF_NAME. Install assignment-review-debug.apk on Android 7+ (allow installs from this source); on first launch enter your school server address."
